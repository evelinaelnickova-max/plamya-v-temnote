<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пламя в темноте — сайт по книге</title>
<style>
:root{
  --bg:#0d0b0f;--bg-soft:#16121a;--panel:#1d1722;--border:#3a2f44;
  --gold:#d4a24e;--gold-soft:#e8c583;--fire:#e8622c;--blood:#a02836;
  --text:#e8e0d8;--dim:#a89fae;--ok:#4caf7d;--radius:14px;
  --shadow:0 10px 40px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);font-family:"Segoe UI",Arial,sans-serif;
  line-height:1.6;min-height:100vh;
  background-image:radial-gradient(circle at 15% 10%,rgba(232,98,44,.08),transparent 45%),
    radial-gradient(circle at 85% 90%,rgba(160,40,54,.10),transparent 45%);
  background-attachment:fixed;
}
a{color:var(--gold-soft);text-decoration:none}
a:hover{color:var(--gold)}
h1,h2,h3{font-family:Georgia,serif;font-weight:normal;line-height:1.2}
.container{width:min(1100px,92%);margin:0 auto}
.nav{position:sticky;top:0;z-index:100;background:rgba(13,11,15,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;
  gap:1rem;padding:.7rem 0;flex-wrap:wrap}
.nav-logo{font-family:Georgia,serif;font-size:1.2rem;color:var(--gold);white-space:nowrap}
.nav-logo span{color:var(--fire)}
.nav-links{display:flex;gap:.15rem;flex-wrap:wrap;list-style:none}
.nav-links a{display:block;padding:.4rem .6rem;border-radius:8px;
  font-size:.86rem;color:var(--dim);transition:.2s;cursor:pointer}
.nav-links a:hover{background:var(--panel);color:var(--gold-soft)}
.nav-links a.active{background:var(--panel);color:var(--gold);box-shadow:inset 0 0 0 1px var(--border)}
.nav-toggle{display:none;background:none;border:1px solid var(--border);
  color:var(--gold);font-size:1.3rem;padding:.2rem .6rem;border-radius:8px;cursor:pointer}
@media(max-width:900px){
  .nav-toggle{display:block}
  .nav-links{display:none;width:100%;flex-direction:column}
  .nav-links.open{display:flex}
}
.section{padding:2.5rem 0}
.section-title{font-size:clamp(1.6rem,4vw,2.3rem);color:var(--gold);
  margin-bottom:.4rem;text-align:center}
.section-sub{text-align:center;color:var(--dim);margin-bottom:1.8rem;
  max-width:640px;margin-left:auto;margin-right:auto;font-size:.95rem}
.panel{background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:1.4rem}
.btn{display:inline-block;background:linear-gradient(135deg,var(--fire),var(--blood));
  color:#fff;border:none;padding:.7rem 1.4rem;border-radius:10px;font-size:1rem;
  cursor:pointer;transition:.2s;font-family:inherit}
.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--gold-soft)}
.btn-ghost:hover{background:var(--bg-soft)}
.hero{padding:4rem 0 3rem;text-align:center;position:relative;overflow:hidden}
.hero-title{font-size:clamp(2.2rem,7vw,4rem);color:var(--gold);
  text-shadow:0 0 40px rgba(232,98,44,.35);margin-bottom:.3rem}
.hero-author{color:var(--dim);letter-spacing:3px;text-transform:uppercase;
  font-size:.8rem;margin-bottom:1.6rem}
.hero-cover{width:min(260px,65%);border-radius:var(--radius);
  box-shadow:var(--shadow),0 0 60px rgba(232,98,44,.25);margin:0 auto 1.6rem;display:block;
  background:var(--bg-soft);min-height:200px;object-fit:cover}
.hero-ann{max-width:680px;margin:0 auto;font-style:italic;opacity:.92;font-size:.95rem}
.feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1.1rem}
.feature-card{background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius);padding:1.3rem;transition:.25s;cursor:pointer}
.feature-card:hover{transform:translateY(-4px);border-color:var(--gold)}
.feature-card h3{color:var(--gold-soft);margin-bottom:.35rem;font-size:1.1rem}
.feature-card p{color:var(--dim);font-size:.9rem}
.filters{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;margin-bottom:1.6rem}
.filter-btn{background:transparent;border:1px solid var(--border);color:var(--dim);
  padding:.4rem 1rem;border-radius:999px;cursor:pointer;transition:.2s;font-size:.88rem;font-family:inherit}
.filter-btn:hover{border-color:var(--gold);color:var(--gold-soft)}
.filter-btn.active{background:var(--gold);color:#1a1410;border-color:var(--gold);font-weight:600}
.chars-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1.2rem}
.char-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;transition:.25s;position:relative}
.char-card:hover{transform:translateY(-5px);border-color:var(--gold);box-shadow:0 14px 40px rgba(0,0,0,.6)}
.char-photo{aspect-ratio:3/4;background:var(--bg-soft);display:flex;align-items:center;
  justify-content:center;overflow:hidden;position:relative}
.char-photo img{width:100%;height:100%;object-fit:cover;display:block}
.char-photo .ph{color:var(--dim);font-size:.8rem;text-align:center;padding:1rem}
.char-tag{position:absolute;top:10px;left:10px;font-size:.68rem;text-transform:uppercase;
  letter-spacing:1px;padding:.22rem .55rem;border-radius:999px;
  background:rgba(13,11,15,.85);border:1px solid var(--border);color:var(--gold-soft)}
.char-info{padding:.85rem 1rem 1rem}
.char-info h3{color:var(--gold);font-size:1.1rem;margin-bottom:.15rem}
.char-info .role{color:var(--dim);font-size:.8rem}
.modal-overlay{position:fixed;inset:0;background:rgba(5,4,7,.82);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;padding:1rem;z-index:200}
.modal-overlay.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  max-width:620px;width:100%;max-height:88vh;overflow-y:auto;position:relative;box-shadow:var(--shadow)}
.modal-close{position:absolute;top:10px;right:12px;background:rgba(13,11,15,.7);
  border:1px solid var(--border);color:var(--gold);width:34px;height:34px;border-radius:50%;
  font-size:1.2rem;cursor:pointer;line-height:1;z-index:2}
.modal-close:hover{background:var(--blood);color:#fff}
.modal-photo{width:100%;max-height:320px;object-fit:cover;display:block;background:var(--bg-soft)}
.modal-body{padding:1.3rem 1.5rem 1.7rem}
.modal-body h2{color:var(--gold);margin-bottom:.15rem}
.modal-role{color:var(--dim);font-size:.88rem;margin-bottom:.9rem}
.modal-body p{font-size:.94rem;margin-bottom:.7rem}
.modal-quote{border-left:3px solid var(--fire);padding-left:.85rem;font-style:italic;
  color:var(--gold-soft);margin-top:.9rem}
.quiz-wrap{max-width:700px;margin:0 auto}
.progress{height:8px;background:var(--bg-soft);border-radius:999px;overflow:hidden;margin-bottom:1.4rem}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--fire),var(--gold));transition:width .3s}
.q-text{font-size:1.15rem;margin-bottom:1.1rem;font-family:Georgia,serif;color:var(--gold-soft)}
.options{display:flex;flex-direction:column;gap:.65rem}
.opt{text-align:left;background:var(--bg-soft);border:1px solid var(--border);
  color:var(--text);padding:.85rem 1rem;border-radius:10px;cursor:pointer;
  transition:.2s;font-size:.95rem;font-family:inherit}
.opt:hover{border-color:var(--gold);background:var(--panel)}
.opt.correct{border-color:var(--ok);background:rgba(76,175,125,.15)}
.opt.wrong{border-color:var(--blood);background:rgba(160,40,54,.18)}
.opt:disabled{cursor:default;opacity:.85}
.q-result{text-align:center;padding:.8rem 0}
.q-result h2{color:var(--gold);font-size:1.7rem;margin-bottom:.5rem}
.q-result p{margin-bottom:.6rem}
.q-quote{font-style:italic;color:var(--gold-soft);margin-top:.8rem}
.q-actions{margin-top:1.3rem;text-align:center}
.q-score{color:var(--dim);margin-top:.5rem}
.q-feedback{margin-top:.7rem;font-size:.88rem;color:var(--dim);min-height:1.1em}
.search{width:100%;max-width:520px;margin:0 auto 1.1rem;display:block;
  background:var(--bg-soft);border:1px solid var(--border);border-radius:10px;
  padding:.75rem 1rem;color:var(--text);font-size:1rem;font-family:inherit}
.search:focus{outline:none;border-color:var(--gold)}
.glist{display:flex;flex-direction:column;gap:.6rem;max-width:820px;margin:0 auto}
.gitem{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:.9rem 1.1rem}
.gitem .term{color:var(--gold);font-weight:600}
.gitem .cat{font-size:.68rem;text-transform:uppercase;letter-spacing:1px;
  color:var(--dim);margin-left:.5rem}
.gitem .def{font-size:.9rem;margin-top:.2rem}
.nores{text-align:center;color:var(--dim);padding:2rem}
.timeline{position:relative;max-width:740px;margin:0 auto;padding-left:1.4rem}
.timeline::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:2px;
  background:linear-gradient(var(--fire),var(--gold),var(--blood))}
.tl{position:relative;padding:0 0 1.8rem 1.4rem}
.tl::before{content:"";position:absolute;left:-1.4rem;top:.5rem;width:14px;height:14px;
  border-radius:50%;background:var(--bg);border:2px solid var(--gold);
  box-shadow:0 0 0 4px rgba(212,162,78,.12);transition:.3s}
.tl.active::before{background:var(--fire);border-color:var(--fire);
  box-shadow:0 0 0 4px rgba(232,98,44,.25)}
.tl-title{color:var(--gold-soft);font-family:Georgia,serif;font-size:1.1rem;margin-bottom:.25rem}
.tl-text{color:var(--dim);font-size:.9rem}
.chapters{display:flex;flex-direction:column;gap:.5rem;max-width:760px;margin:0 auto}
.ch{display:flex;align-items:center;gap:.8rem;background:var(--panel);
  border:1px solid var(--border);border-radius:10px;padding:.75rem 1rem;transition:.2s}
.ch.done{border-color:var(--ok);background:rgba(76,175,125,.08)}
.ch input{width:19px;height:19px;accent-color:var(--ok);cursor:pointer;flex-shrink:0}
.ch label{flex:1;cursor:pointer;font-size:.94rem}
.ch.done label{color:var(--dim);text-decoration:line-through}
.tracker{max-width:520px;margin:1.3rem auto 1.8rem;text-align:center}
.tbar{height:13px;background:var(--bg-soft);border-radius:999px;overflow:hidden;border:1px solid var(--border)}
.tbar-fill{height:100%;width:0;background:linear-gradient(90deg,var(--fire),var(--gold));transition:width .35s}
.tcount{margin-top:.5rem;color:var(--dim);font-size:.88rem}
.codex{max-width:720px;margin:0 auto;background:#1a1410;border:1px solid #4a3a24;
  border-radius:var(--radius);padding:2.2rem 1.8rem;font-family:Georgia,serif;color:#c9bfa8;
  box-shadow:inset 0 0 80px rgba(0,0,0,.6),var(--shadow)}
.codex h2{color:var(--gold);text-align:center;margin-bottom:1.3rem;letter-spacing:1px}
.codex p{font-size:1.05rem;line-height:1.9;margin-bottom:.9rem}
.ink{color:transparent;border-bottom:1px dashed rgba(201,191,168,.25);
  transition:.5s;cursor:pointer}
.ink:hover,.ink.on{color:#e8c583;text-shadow:0 0 12px rgba(232,197,131,.5);border-bottom-color:transparent}
.codex-hint{text-align:center;color:var(--dim);font-size:.83rem;margin-top:1.2rem;font-family:"Segoe UI",sans-serif}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1.2rem}
.dcard{background:linear-gradient(160deg,#201a26,#17121c);border:1px solid var(--border);
  border-radius:var(--radius);padding:1.3rem;position:relative;box-shadow:var(--shadow)}
.dcard::before{content:"ШЕ’РУ";position:absolute;top:12px;right:14px;font-size:.66rem;
  letter-spacing:3px;color:rgba(212,162,78,.35);border:1px solid rgba(212,162,78,.25);
  padding:.12rem .45rem;border-radius:4px}
.dcard h3{color:var(--gold);font-size:1.2rem;margin-bottom:.15rem}
.dcard .sub{color:var(--dim);font-size:.82rem;margin-bottom:.9rem}
.stats{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.9rem}
.stat{font-size:.82rem}
.stat-l{display:flex;justify-content:space-between;color:var(--dim);margin-bottom:.15rem}
.stat-b{height:7px;background:var(--bg-soft);border-radius:999px;overflow:hidden}
.stat-f{height:100%;background:linear-gradient(90deg,var(--fire),var(--gold));width:0;transition:width .7s}
.dcard .desc{font-size:.88rem}
.eggs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1.1rem}
.egg{background:var(--panel);border:1px dashed var(--border);border-radius:var(--radius);
  padding:1.2rem;cursor:pointer;transition:.25s;min-height:120px}
.egg:hover{border-color:var(--gold)}
.egg h3{color:var(--gold-soft);font-size:1rem;margin-bottom:.25rem}
.egg p{color:var(--dim);font-size:.85rem}
.egg .back{display:none}
.egg.open{border-style:solid;border-color:var(--gold)}
.egg.open .front{display:none}
.egg.open .back{display:block;animation:fade .4s}
.egg.open .back p{color:var(--text);font-size:.9rem}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.footer{border-top:1px solid var(--border);padding:1.8rem 0;text-align:center;
  color:var(--dim);font-size:.82rem;margin-top:2.5rem}
.footer .quote{font-family:Georgia,serif;color:var(--gold-soft);margin-bottom:.3rem}
.hidden{display:none!important}
</style>
</head>
<body>

<nav class="nav">
  <div class="container nav-inner">
    <div class="nav-logo">Пламя <span>в темноте</span></div>
    <button class="nav-toggle" onclick="document.getElementById('nl').classList.toggle('open')">☰</button>
    <ul class="nav-links" id="nl"></ul>
  </div>
</nav>

<main id="app"></main>

<footer class="footer">
  <div class="container">
    <div class="quote">«Лавер Раверсин. Шаал Де Лавер.»</div>
    <div>Фан-сайт по книге Тани Нордсвей «Пламя в темноте». Все тексты принадлежат автору.</div>
  </div>
</footer>

<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox"></div>
</div>

<script>
/* ============================================================
   ДАННЫЕ — всё по тексту книги
   ============================================================ */

const CHARACTERS=[
 {id:"rebekka",name:"Ребекка Амайя",full:"Десма Лилиан Ребекка Амайя Хати Марриенсен",
  role:"Всадница Руны, королева Дикой Охоты",faction:"dikaya",img:"images/rebekka.jpg",
  desc:"Сирота-полукровка, дочь Кироса Марриенсена и смертной женщины (гл. 15). С тринадцати лет прогуливала школу (гл. 9). После смерти матери осталась с младшим братом Ромусом. Обуздала чёрную драконицу Руну на Пустом острове, чтобы попасть в Лармар и спасти брата. Пустая. После инициации стала королевой Дикой Охоты.",

  role:"Верховный баргат, король Дикой Охоты",faction:"dikaya",img:"images/shayan.jpg",
  desc:"Верховный баргат Шеррувии, комендант академии Лармар, глава ше’ру. Наследник Двора Дикой Охоты, брат погибшего короля (гл. 25). Триста лет назад проклят Клаусом и Кайлом, заставлявшими его убивать свой народ. Огонь и кровь — его элементы. Истинная пара Ребекки. Второе имя — Араш.",
  quote:"Ты моя одержимость.",
  stats:{strength:95,magic:95,mind:88,loyalty:90}},
 {id:"runa",name:"Рунфрид Дей’Кейн",full:"Рунфрид Дей’Кейн (Руна)",
  role:"Чёрная драконица, наследница Двора Драконов",faction:"drakony",img:"images/runa.jpg",
  desc:"Последняя наследница династии Чернозубых драконов Сумрачной равнины, наследница драконьего престола (гл. 16, 25). Племянница драконьей принцессы, родной тёти, вступившей в союз с королём Дикой Охоты (гл. 25). Саркастичная, обожает пиво и крабов. Десятилетиями скрывалась на Пустом острове, пока не выбрала Ребекку всадницей.",

 {id:"alakay",name:"Алакай Йоль",full:"Алакай Йоль (Кай)",

  desc:"Молчаливый ше’ру с севера, всадник белой драконицы Саны. Потерял младшую сестру, чей амулет носит как память (гл. 12, 18). Спасает Ребекку от Балара, дарит ей амулет и становится её другом. Впоследствии женится на Рунфрид (гл. 31).",
  quote:"Я полагаю, тебе здесь нужен друг, Ребекка.",

 {id:"romus",name:"Ромус Шаалер",full:"Ромус Акрам Галиб Данис Шаалер",

  desc:"Младший брат Ребекки по матери, сын помощника пекаря с севера (гл. 9). Хилый, вечно болеющий, но с блестящим умом. Оказался гарпией — древним существом, хранителем знаний (гл. 25). После инициации вырос на десять лет и обрёл крылья, рога и силу (гл. 26). Первый Хранитель Шторма (эпилог).",

 {id:"kayl",name:"Кайл Марриенсен",full:"Кайл Эйден Аксель Амайя Сколь Марриенсен",

  desc:"Дядя Ребекки, второй сын Магнуса Марриенсена (гл. 15). Прозван Пожирателем за способность забирать чужие силы. Триста лет назад вместе с Клаусом наложил проклятие на Дворы и переместил Сумрачный Двор в измерение Света и Тени (гл. 25). Мечтал о власти над миром. Убит Ребеккой и Шаяном (гл. 29).",

 {id:"darrok",name:"Даррок",full:"Даррок",
  role:"Дракон Шаяна",faction:"drakony",img:"images/darrok.jpg",
  desc:"Дракон верховного баргата. В человеческом облике — короткие темно-красные волосы и шрам на лице (гл. 16). Мудрый и язвительный. Предупреждает Шаяна об опасности магии крови и помогает спасти Ребекку, делясь своим элементом (гл. 16).",
  quote:"Чувства всегда будут превыше нас, превыше долга.",

 {id:"sana",name:"Санфрид",full:"Санфрид (Сана)",

  desc:"Белоснежная драконица Алакая, смертоносная и грациозная (гл. 4). В человеческом облике — каре белоснежных волос, предпочитает белый цвет (гл. 31). Близкая подруга Ребекки, помогает принимать роды у Рунфрид (эпилог). Прямой речи в книге не имеет.",
  quote:"",stats:{strength:90,magic:88,mind:85,loyalty:95}}
];
const FACTIONS=[{id:"all",label:"Все"},{id:"dikaya",label:"Дикая Охота"},
 {id:"drakony",label:"Двор Драконов"},{id:"sheru",label:"Ше’ру"},{id:"marrien",label:"Марриенсены"}];

const QUIZ_WHO={
 questions:[

function buildNav(){
 const ul=document.getElementById("nl");
 ul.innerHTML=PAGES.map(p=>`<li><a data-page="${p.id}" onclick="go('${p.id}')">${p.label}</a></li>`).join("");
}

function go(id){
 location.hash=id;
}

function render(){
 const id=(location.hash||"#home").slice(1)||"home";
 document.querySelectorAll(".nav-links a").forEach(a=>{
   a.classList.toggle("active",a.dataset.page===id);
 });
 document.getElementById("nl").classList.remove("open");
 const app=document.getElementById("app");
 const fn=ROUTES[id]||ROUTES.home;
 app.innerHTML=fn();
 if(fn.after)fn.after();
 window.scrollTo(0,0);
}

window.addEventListener("hashchange",render);

ROUTES.chars.after=()=>{filterChars("all",document.querySelector(".filter-btn"));};

function filterChars(f,btn){
 document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
 if(btn)btn.classList.add("active");
 const list=f==="all"?CHARACTERS:CHARACTERS.filter(c=>c.faction===f);
 document.getElementById("charsGrid").innerHTML=list.map(c=>`
  <div class="char-card" onclick="openChar('${c.id}')">
    <div class="char-photo">
      <img src="${c.img}" alt="${c.name}" onerror="this.style.display='none';this.parentNode.innerHTML='<div class=&quot;ph&quot;>${c.name}</div>'">
      <span class="char-tag">${(FACTIONS.find(x=>x.id===c.faction)||{}).label||""}</span>
    </div>
    <div class="char-info">
      <h3>${c.name}</h3>
      <div class="role">${c.role}</div>
    </div>
  </div>`).join("");
}

function openChar(id){
 const c=CHARACTERS.find(x=>x.id===id);
 document.getElementById("modalBox").innerHTML=`
  <button class="modal-close" onclick="closeModal()">×</button>
  <img class="modal-photo" src="${c.img}" alt="${c.name}" onerror="this.style.display='none'">
  <div class="modal-body">
    <h2>${c.name}</h2>
    <div class="modal-role">${c.role}${c.full&&c.full!==c.name?" · "+c.full:""}</div>
    <p>${c.desc}</p>
    ${c.quote?`<div class="modal-quote">«${c.quote}»</div>`:""}
  </div>`;
 document.getElementById("modal").classList.add("open");
}
function closeModal(){document.getElementById("modal").classList.remove("open");}

/* --- Тест «Кто ты» --- */
let whoState={i:0,score:{flame:0,empty:0,dragon:0,harpy:0}};
ROUTES.who=()=>{
 whoState={i:0,score:{flame:0,empty:0,dragon:0,harpy:0}};
 return `<section class="section"><div class="container">
  <h2 class="section-title">Кто ты из мира Лармара?</h2>
  <p class="section-sub">Семь вопросов — и узнаешь, чьё пламя горит в твоей душе.</p>
  <div class="quiz-wrap panel" id="whoBox"></div>
 </div></section>`;
};
ROUTES.who.after=()=>renderWho();

function renderWho(){
 const box=document.getElementById("whoBox");
 const q=QUIZ_WHO.questions[whoState.i];
 box.innerHTML=`
  <div class="progress"><div class="progress-bar" style="width:${whoState.i/QUIZ_WHO.questions.length*100}%"></div></div>
  <div class="q-text">${whoState.i+1}. ${q.q}</div>
  <div class="options">
    ${q.o.map((o,i)=>`<button class="opt" onclick="whoPick(${i})">${o[0]}</button>`).join("")}
  </div>`;
}
function whoPick(i){
 const q=QUIZ_WHO.questions[whoState.i];
 whoState.score[q.o[i][1]]++;
 whoState.i++;
 if(whoState.i<QUIZ_WHO.questions.length){renderWho();}
 else{
   const key=Object.keys(whoState.score).sort((a,b)=>whoState.score[b]-whoState.score[a])[0];
   const r=QUIZ_WHO.results[key];
   document.getElementById("whoBox").innerHTML=`
    <div class="q-result">
      <h2>${r.title}</h2>
      <p><b>Твой герой:</b> ${r.char}</p>
      <p>${r.text}</p>
      <div class="q-quote">«${r.quote}»</div>
      <div class="q-actions"><button class="btn" onclick="restartWho()">Пройти заново</button></div>
    </div>`;
 }
}
function restartWho(){whoState={i:0,score:{flame:0,empty:0,dragon:0,harpy:0}};renderWho();}

/* --- Викторина цитат --- */
let qqState={i:0,score:0};
ROUTES.quotes=()=>{
 qqState={i:0,score:0};
 return `<section class="section"><div class="container">
  <h2 class="section-title">Угадай, кто сказал</h2>
  <p class="section-sub">Десять цитат из книги. Выбери, кому они принадлежат.</p>
  <div class="quiz-wrap panel" id="qqBox"></div>
 </div></section>`;
};
ROUTES.quotes.after=()=>renderQQ();

function renderQQ(){
 const box=document.getElementById("qqBox");
 if(qqState.i>=QUIZ_QUOTES.length){
   box.innerHTML=`<div class="q-result">
     <h2>Результат</h2>
     <p>Ты угадал(а) <b>${qqState.score}</b> из ${QUIZ_QUOTES.length}.</p>
     <div class="q-actions"><button class="btn" onclick="restartQQ()">Пройти заново</button></div>
   </div>`;
   return;
 }
 const q=QUIZ_QUOTES[qqState.i];
 box.innerHTML=`
  <div class="progress"><div class="progress-bar" style="width:${qqState.i/QUIZ_QUOTES.length*100}%"></div></div>
  <div class="q-text">«${q.q}»</div>
  <div class="options">
    ${q.o.map((o,i)=>`<button class="opt" onclick="qqPick(${i},this)">${o}</button>`).join("")}
  </div>
  <div class="q-feedback" id="qqFb"></div>`;
}
function qqPick(i,btn){
 const q=QUIZ_QUOTES[qqState.i];
 const opts=document.querySelectorAll("#qqBox .opt");
 opts.forEach(o=>o.disabled=true);
 if(i===q.c){btn.classList.add("correct");qqState.score++;}
 else{btn.classList.add("wrong");opts[q.c].classList.add("correct");}
 document.getElementById("qqFb").textContent=q.n;
 setTimeout(()=>{qqState.i++;renderQQ();},1100);
}
function restartQQ(){qqState={i:0,score:0};renderQQ();}

/* --- Словарь --- */
ROUTES.gloss=()=>`
<section class="section"><div class="container">
  <h2 class="section-title">Словарь</h2>
  <p class="section-sub">Термины, титулы, артефакты и места из книги.</p>
  <input class="search" id="gSearch" placeholder="Поиск по термину или описанию..." oninput="renderGloss()">
  <div class="glist" id="gList"></div>
</div></section>`;
ROUTES.gloss.after=()=>renderGloss();

function renderGloss(){
 const q=(document.getElementById("gSearch").value||"").toLowerCase();
 const list=GLOSSARY.filter(g=>g.t.toLowerCase().includes(q)||g.d.toLowerCase().includes(q));
 const el=document.getElementById("gList");
 if(!list.length){el.innerHTML='<div class="nores">Ничего не найдено.</div>';return;}
 el.innerHTML=list.map(g=>`
  <div class="gitem">
    <span class="term">${g.t}</span><span class="cat">${g.c}</span>
    <div class="def">${g.d}</div>
  </div>`).join("");
}

/* --- Таймлайн --- */
ROUTES.timeline=()=>`
<section class="section"><div class="container">
  <h2 class="section-title">Таймлайн</h2>
  <p class="section-sub">Ключевые события книги.</p>
  <div class="timeline">${TIMELINE.map(t=>`
    <div class="tl"><div class="tl-title">${t.t}</div><div class="tl-text">${t.d}</div></div>`).join("")}
  </div>
</div></section>`;
ROUTES.timeline.after=()=>{
 const items=document.querySelectorAll(".tl");
 const obs=new IntersectionObserver(es=>{
   es.forEach(e=>{if(e.isIntersecting)e.target.classList.add("active");});
 },{threshold:.4});
 items.forEach(i=>obs.observe(i));
};

/* --- Трекер --- */
ROUTES.tracker=()=>{
 const done=JSON.parse(localStorage.getItem("pvt_done")||"[]");
 return `<section class="section"><div class="container">
  <h2 class="section-title">Трекер чтения</h2>
  <p class="section-sub">Отмечай прочитанные главы — прогресс сохраняется в браузере.</p>
  <div class="tracker">
    <div class="tbar"><div class="tbar-fill" id="tFill"></div></div>
    <div class="tcount" id="tCount"></div>
  </div>
  <div class="chapters" id="chList">
    ${CHAPTERS.map((c,i)=>`
      <div class="ch ${done.includes(i)?'done':''}" data-i="${i}">
        <input type="checkbox" id="ch${i}" ${done.includes(i)?"checked":""} onchange="toggleCh(${i},this)">
        <label for="ch${i}">${c}</label>
      </div>`).join("")}
  </div>
 </div></section>`;
};
ROUTES.tracker.after=()=>updateTracker();

function toggleCh(i,cb){
 let done=JSON.parse(localStorage.getItem("pvt_done")||"[]");
 if(cb.checked){if(!done.includes(i))done.push(i);}
 else{done=done.filter(x=>x!==i);}
 localStorage.setItem("pvt_done",JSON.stringify(done));
 document.querySelector(`.ch[data-i="${i}"]`).classList.toggle("done",cb.checked);
 updateTracker();
}
function updateTracker(){
 const done=JSON.parse(localStorage.getItem("pvt_done")||"[]");
 const p=Math.round(done.length/CHAPTERS.length*100);
 const f=document.getElementById("tFill"),c=document.getElementById("tCount");
 if(f)f.style.width=p+"%";
 if(c)c.textContent=`Прочитано ${done.length} из ${CHAPTERS.length} (${p}%)`;
}

/* --- Кодекс --- */
ROUTES.codex=()=>`
<section class="section"><div class="container">
  <h2 class="section-title">Кодекс</h2>
  <p class="section-sub">Исчезающие чернила: наведи или нажми на пропуск, чтобы проявить текст.</p>
  <div class="codex">
    <h2>Двенадцать пустых</h2>
    ${CODEX.map(line=>`<p>${hideSome(line)}</p>`).join("")}
    <div class="codex-hint">Николаус Марриенсен · Лавер Раверсин · Шаал Де Лавер</div>
  </div>
</div></section>`;
ROUTES.codex.after=()=>{
 document.querySelectorAll(".ink").forEach(s=>{
   s.addEventListener("click",()=>s.classList.toggle("on"));
 });
};
function hideSome(line){
 const words=line.split(" ");
 return words.map(w=>{
   if(w.length>4&&Math.random()>.45){
     return `<span class="ink">${w}</span>`;
   }
   return w;
 }).join(" ");
}

<section class="section"><div class="container">

</div></section>`;
